aid: vera-security
name: Vera Security
description: >-
  Vera Security (Vera, Inc.) was an enterprise data-centric security and
  information rights management (IRM) company founded in 2014 and headquartered
  in Palo Alto, California. Its platform applied encryption, access policy,
  tracking, watermarking, and remote revocation that travel with a file
  wherever it goes across users, devices, applications, and cloud services,
  and it exposed an IRM-as-a-service REST API and SDK so developers could embed
  those data-protection controls into their own applications. Backed by Battery
  Ventures, Sutter Hill Ventures, Amplify Partners, Hasso Plattner Ventures, and
  BMW i Ventures (roughly $77M raised), Vera was acquired by HelpSystems (now
  Fortra) in December 2020; the product now ships as Fortra / Digital Guardian
  Secure Collaboration. This profile documents the company's residual public
  surface for the API Evangelist network.
